name: Commons photos
# Fetch freely licensed Wikimedia Commons photos. Trigger: push videos/<ID>/commons/request.json {"q": "...", "n": 12}
on:
  push:
    branches: [history-invoice-brain]
    paths: ["videos/**/commons/request.json"]
permissions:
  contents: write
jobs:
  commons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'videos/**/commons/request.json'); do
            d=$(dirname $f); q=$(python -c "import json;print(json.load(open('$f'))['q'])"); n=$(python -c "import json;print(json.load(open('$f')).get('n',12))")
            python scripts/commons_photos.py "$d" "$q" "$n"
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/*/commons
          git commit -m "commons: candidate photos [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q origin ${{ github.ref_name }} && git push && break; sleep 5; done
