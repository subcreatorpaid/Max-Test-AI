name: INV-006 render (8 parts in parallel)
# One job per part: Kokoro voice + graphics/footage render. Silent part video + VO wav are committed back
# in <=40 s chunks; Claude stitches, mixes music/SFX (private kit SFX never touch GitHub) and reviews.
on:
  push:
    branches: [history-invoice-brain]
    paths: ["videos/INV-006-winter-bill/render/go.json"]
permissions:
  contents: write
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [CO, P1, BR, P2, P3, P4, P5, RC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip -q install kokoro-onnx soundfile pyloudnorm pyshp pillow numpy
      - uses: actions/cache@v4
        with:
          path: ~/kok
          key: kokoro-v1.0
      - name: Voice models
        run: |
          mkdir -p ~/kok; cd ~/kok
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -s $f ] || curl -sSL -o $f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f; done
      - name: Voice (${{ matrix.part }})
        env:
          KOKMODELS: /home/runner/kok
        run: mkdir -p vo && python tools/inv006/vo6.py tools/inv006/script_v4.py vo ${{ matrix.part }}
      - name: Render (${{ matrix.part }})
        env:
          WORKERS: "4"
        run: |
          python tools/inv006/render_part.py ${{ matrix.part }} vo out videos/INV-006-winter-bill/broll videos/INV-006-lib/broll videos/INV-006-photos/storyboard/stills
      - name: Commit part
        run: |
          P=${{ matrix.part }}; D=videos/INV-006-winter-bill/render/parts; mkdir -p $D
          rm -f $D/$P-*.mp4
          ffmpeg -nostdin -loglevel error -i out/$P.mp4 -c copy -f segment -segment_time 40 -reset_timestamps 1 $D/$P-%02d.mp4
          cp vo/INV-006-$P.wav $D/$P.wav; cp out/$P-shots.json $D/; cp vo/segs6.json $D/$P-segs.json
          ls -la $D
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $D/$P-*.mp4 $D/$P.wav $D/$P-shots.json $D/$P-segs.json
          git commit -qm "render: INV-006 part $P [skip ci]"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q origin history-invoice-brain && git push -q && break; sleep $((RANDOM % 10 + 3)); done
