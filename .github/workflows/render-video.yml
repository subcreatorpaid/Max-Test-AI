name: Video render (parallel parts, any video)
# Reusable for every video. Trigger: push videos/<ID>/render/go.json with
# {"tools": "tools/inv006", "script": "tools/inv006/script_v4.py", "parts": ["CO","P1",...],
#  "clipdirs": ["videos/<ID>/broll", "videos/INV-006-lib/broll", "videos/INV-006-photos/storyboard/stills"]}
# Each part = one runner (voice + render). Outputs land in videos/<ID>/render/parts/. Claude stitches + mixes.
on:
  push:
    branches: [history-invoice-brain, main]
    paths: ["videos/*/render/go.json", "!videos/INV-006-winter-bill/render/go.json"]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cfg: ${{ steps.p.outputs.cfg }}
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        run: |
          f=$(git diff --name-only HEAD~1 HEAD -- 'videos/*/render/go.json' | head -1)
          echo "cfg=$f" >> $GITHUB_OUTPUT
          echo "parts=$(python3 -c "import json;print(json.dumps(json.load(open('$f'))['parts']))")" >> $GITHUB_OUTPUT
  part:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip -q install kokoro-onnx soundfile pyloudnorm pyshp pillow numpy
      - uses: actions/cache@v4
        with: { path: ~/kok, key: kokoro-v1.0 }
      - name: Voice models
        run: |
          mkdir -p ~/kok; cd ~/kok
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -s $f ] || curl -sSL -o $f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f; done
      - name: Voice + render
        env: { KOKMODELS: /home/runner/kok, WORKERS: "4" }
        run: |
          CFG=${{ needs.plan.outputs.cfg }}; P=${{ matrix.part }}
          TOOLS=$(python3 -c "import json;print(json.load(open('$CFG'))['tools'])")
          SCRIPT=$(python3 -c "import json;print(json.load(open('$CFG'))['script'])")
          DIRS=$(python3 -c "import json;print(' '.join(json.load(open('$CFG'))['clipdirs']))")
          mkdir -p vo out
          python $TOOLS/vo6.py $SCRIPT vo $P
          python $TOOLS/render_part.py $P vo out $DIRS
      - name: Commit part
        run: |
          CFG=${{ needs.plan.outputs.cfg }}; P=${{ matrix.part }}; D=$(dirname $CFG)/parts; mkdir -p $D
          rm -f $D/$P-*.mp4
          ffmpeg -nostdin -loglevel error -i out/$P.mp4 -c copy -f segment -segment_time 40 -reset_timestamps 1 $D/$P-%02d.mp4
          cp vo/*-$P.wav $D/$P.wav; cp out/$P-shots.json $D/; cp vo/segs6.json $D/$P-segs.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $D/$P-*.mp4 $D/$P.wav $D/$P-shots.json $D/$P-segs.json
          git commit -qm "render: part $P [skip ci]"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q && break; sleep $((RANDOM % 10 + 3)); done
