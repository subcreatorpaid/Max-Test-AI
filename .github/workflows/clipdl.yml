name: Clip picks download (Pixabay CDN, trimmed)
on:
  push:
    branches: [history-invoice-brain]
    paths: ["videos/**/clips/picks.json"]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg jq >/dev/null
      - name: Download and trim picks
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'videos/**/clips/picks.json'); do
            d=$(dirname "$f"); mkdir -p "$d/picked"
            jq -r '.picks | to_entries[] | "\(.key) \(.value.url)"' "$f" | while read code url; do
              [ -f "$d/picked/$code.mp4" ] && continue
              curl -sSfL --retry 3 -o /tmp/src.mp4 "$url" || { echo "fail $code"; continue; }
              ffmpeg -nostdin -loglevel error -y -i /tmp/src.mp4 -t 20 -an -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30" -c:v libx264 -crf 24 -preset veryfast -pix_fmt yuv420p "$d/picked/$code.mp4" || echo "ffmpeg fail $code"
            done
            ls -la "$d/picked"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f videos/*/clips/picked/*.mp4 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "clips: picked + trimmed [skip ci]"; for i in 1 2 3 4 5; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q && break; sleep 5; done; }
