name: B-roll fetch (Pixabay + Coverr)
# Reads keys only from the PIXABAY_API_KEY and COVERR_API_KEY repository secrets; keys never appear in logs or files.
on:
  # Runs when a video's broll.json changes on the backup branch (the Run button only works on a default branch)
  push:
    branches: [history-invoice-brain, main]
    paths: ["videos/**/broll.json", "videos/**/music.json"]
  workflow_dispatch:
    inputs:
      video:
        description: "Video folder, e.g. videos/INV-006-winter-bill"
        required: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: |
          if [ -n "${{ inputs.video }}" ]; then dirs="${{ inputs.video }}"; else
            dirs=$(git diff --name-only HEAD~1 HEAD -- 'videos/**/broll.json' 'videos/**/music.json' | xargs -r -n1 dirname | sort -u); fi
          [ -z "$dirs" ] && dirs=$(dirname $(ls videos/*/broll.json | tail -1))
          mkdir -p out
          for d in $dirs; do
            mkdir -p "$d/broll"
            changed=$(git diff --name-only HEAD~1 HEAD -- "$d")
            if echo "$changed" | grep -q broll.json || [ -n "${{ inputs.video }}" ]; then
              if [ -n "$PIXABAY_API_KEY" ]; then python scripts/pixabay_fetch.py "$d" || echo "pixabay step failed"; fi
              if [ -n "$COVERR_API_KEY" ]; then python scripts/coverr_fetch.py "$d" || echo "coverr step failed"; fi
            elif [ -n "$COVERR_API_KEY" ]; then
              python scripts/coverr_fetch.py "$d" --music-only || echo "coverr step failed"
            fi
            mkdir -p "out/$(basename $d)"; cp -r "$d/broll" "out/$(basename $d)/"; [ -d "$d/music" ] && cp -r "$d/music" "out/$(basename $d)/" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: broll
          path: out/
          retention-days: 7
      - name: Save clips to the branch (so Claude can copy them to the PC)
        if: github.ref_name == 'history-invoice-brain'
        run: |
          find videos -path '*/broll/*' -size +95M -print -delete || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/*/broll videos/*/music 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "broll: stock clips [skip ci]"; git push; }
